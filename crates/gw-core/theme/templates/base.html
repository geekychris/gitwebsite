<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page_title and page_title != site.title %}{{ page_title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
{% if noindex %}<meta name="robots" content="noindex,nofollow,noarchive">{% endif %}
<link rel="canonical" href="{{ site.base_url | trim_end_matches(pat='/') }}{{ page_path }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:site_name" content="{{ site.title }}">
{% block og %}{% endblock %}
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
{% if analytics_id %}<script>
if (!/^(localhost|127\.|\[::1\])/.test(location.hostname)) {
  var s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id={{ analytics_id }}'; document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', '{{ analytics_id }}');
}
</script>{% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="/">{{ site.title }}</a>
    <nav class="nav">
      {% for n in nav %}<a href="{{ n.href }}"{% if page_path is starting_with(n.href) %} aria-current="page"{% endif %}>{{ n.label }}</a>{% endfor %}
      <button class="search-btn" type="button" aria-label="Search" data-search-open>Search <kbd>/</kbd></button>
    </nav>
  </div>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="foot">
  <div class="wrap foot-inner">
    <span>© {{ build_year }} {{ site.author }}</span>
    <span class="foot-links">{% for l in site.links %}<a href="{{ l.href }}">{{ l.label }}</a>{% endfor %}<a href="/feed.xml">Feed</a></span>
  </div>
</footer>
<div class="search" hidden data-search>
  <div class="search-box">
    <input type="search" placeholder="Search articles, projects, apps…" aria-label="Search" data-search-input>
    <ol class="search-results" data-search-results></ol>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js" defer></script>
<script src="/js/site.js" defer></script>
</body>
</html>
